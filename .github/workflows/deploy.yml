name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Права на уровне всего workflow
permissions:
  contents: read
  pages: write
  id-token: write

# Предотвращаем конфликты параллельных деплоев
concurrency:
  group: "pages"
  cancel-in-progress: false # Ставим false для деплоя, чтобы текущий деплой доходил до конца

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build
        working-directory: frontend
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_TELEGRAM_BOT_USERNAME: ${{ vars.TELEGRAM_BOT_USERNAME }}
          VITE_TELEGRAM_APP_NAME: ${{ vars.TELEGRAM_APP_NAME }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # КРИТИЧЕСКИ ВАЖНО: Дублируем permissions непосредственно в job deploy
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
