name: Telegram Bot (24/7 Shift Work)

on:
  schedule:
    # Запуск каждые 6 часов и 30 минут (интервал смены)
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: telegram-bot
  cancel-in-progress: true

jobs:
  process:
    runs-on: ubuntu-latest
    # Лимит работы воркер-машины — 6 часов + запас на финализацию/комит
    timeout-minutes: 375

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Telegram bot (6 hours shift)
        working-directory: frontend
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_CHAT_IDS: ${{ secrets.ADMIN_CHAT_IDS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          DELAY_REPORT_THRESHOLD: ${{ vars.DELAY_REPORT_THRESHOLD || '5' }}
          DELAY_REPORT_WINDOW_MINUTES: ${{ vars.DELAY_REPORT_WINDOW_MINUTES || '60' }}
          DELAY_ALERT_DURATION_HOURS: ${{ vars.DELAY_ALERT_DURATION_HOURS || '2' }}
          # 360 минут = 6 часов непрерывной работы (long-polling)
          RUN_DURATION_MINUTES: '360'
          POLL_TIMEOUT_SECONDS: ${{ vars.POLL_TIMEOUT_SECONDS || '25' }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node scripts/process-telegram-bot.mjs

      - name: Final commit & push updates
        if: always()
        run: |
          git add frontend/data-runtime frontend/public/data/route-alerts.json
          git diff --cached --quiet || git commit -m "chore: process telegram bot updates"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || echo "Нема нових комітів для пушу"
