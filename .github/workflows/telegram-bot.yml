name: Telegram Bot (support + затримки)

# Немає постійного сервера, тому цей workflow не просто "пінгує" API раз на
# кілька хвилин, а раз на RUN_INTERVAL (за замовчуванням кожні 3 години)
# піднімає завдання, яке саме тримає активне long-polling з'єднання до
# Telegram (getUpdates) протягом RUN_DURATION_MINUTES (~55 хв) — тобто
# годину з кожних трьох бот працює практично "наживо" (повідомлення й
# відповіді адміна обробляються за секунди), а решту часу економить хвилини
# GitHub Actions. Комітить оновлений route-alerts.json/data-runtime назад у
# репозиторій одразу після кожного циклу, у якому щось реально прийшло —
# банер про затримку в застосунку зʼявляється протягом чергової "зміни",
# а не чекає завершення всього запуску.
#
# Хочете справжній 24/7 без вікон чергування — використайте bot/telegram_bot.py
# на своєму VPS/сервері (той самий формат даних, docs у bot/README.md).
#
# ВАЖЛИВО: коміти цього workflow НЕ позначені [skip ci] навмисно — Pages
# живить лише статичні файли з останнього білда, тому кожен коміт з новими
# даними (route-alerts.json) має тригернути звичайний push-workflow
# `deploy.yml`, який пересобере й передеплоїть сайт. Якщо повернути
# [skip ci] у повідомлення коміту — GitHub взагалі не запустить жодного
# push-workflow для цього коміту (це його вбудована поведінка, не залежить
# від назви конкретного workflow), і оголошення про затримку ніколи не
# зʼявиться на задеплоєному сайті, хоч у самому репозиторії дані вже оновлені.
#
# Змінити розклад чергування: відредагуйте `cron` нижче і, за бажання,
# RUN_DURATION_MINUTES у Variables (Settings → Secrets and variables →
# Actions → Variables).
on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: telegram-bot
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    # Трохи менше за інтервал розкладу (3 год), щоб завдання завжди встигало
    # завершитись і закомітити до того, як GitHub спробує запустити наступне.
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Telegram bot (long-polling чергування ~1 год)
        working-directory: frontend
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_CHAT_IDS: ${{ secrets.ADMIN_CHAT_IDS }}
          DELAY_REPORT_THRESHOLD: ${{ vars.DELAY_REPORT_THRESHOLD || '5' }}
          DELAY_REPORT_WINDOW_MINUTES: ${{ vars.DELAY_REPORT_WINDOW_MINUTES || '60' }}
          DELAY_ALERT_DURATION_HOURS: ${{ vars.DELAY_ALERT_DURATION_HOURS || '2' }}
          RUN_DURATION_MINUTES: ${{ vars.RUN_DURATION_MINUTES || '55' }}
          POLL_TIMEOUT_SECONDS: ${{ vars.POLL_TIMEOUT_SECONDS || '25' }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node scripts/process-telegram-bot.mjs

      - name: Final safety-net commit
        # Скрипт вище вже комітить після кожного циклу зі змінами — цей крок
        # лише підстраховує, якщо щось лишилось незакомічене (наприклад,
        # git push у скрипті не вдався через тимчасову мережеву помилку).
        run: |
          git add frontend/data-runtime frontend/public/data/route-alerts.json
          git diff --cached --quiet || git commit -m "chore: process telegram bot updates"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || echo "Нема нових комітів для пушу"
