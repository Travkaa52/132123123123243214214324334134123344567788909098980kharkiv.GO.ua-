<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#05522E" />
    <meta name="description" content="Kharkiv GO — транспорт Харкова в реальному часі" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preload" href="/fonts/e-UkraineHead/e-UkraineHead-Bold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/e-Ukraine/e-Ukraine-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <title>Kharkiv GO — транспорт у реальному часі</title>
    <script>
      // Друга половина трюку зі spa-github-pages (див. public/404.html):
      // якщо 404.html щойно переклав реальний шлях у query-рядок
      // ("?/install-app"), відновлюємо його в history ДО того, як
      // React Router встигне змонтуватися і побачити "/" замість
      // справжнього запитаного шляху.
      (function () {
        var search = window.location.search;
        if (search[1] === '/') {
          var decoded = search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            });
          var path = decoded.shift();
          var rest = decoded.length ? '?' + decoded.join('&') : '';
          window.history.replaceState(
            null,
            '',
            window.location.pathname.replace(/\/$/, '') + '/' + path + rest + window.location.hash
          );
        }
      })();
    </script>
  </head>
  <body class="bg-surface-soft font-body text-graphite">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
