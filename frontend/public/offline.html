<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Kharkiv GO — немає з'єднання</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #05120c;
        color: #f2f5f3;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .wrap {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 24px;
        text-align: center;
      }
      .emoji { font-size: 44px; }
      h1 { font-size: 17px; font-weight: 800; margin: 0; }
      p { font-size: 13.5px; opacity: 0.65; margin: 0; max-width: 280px; line-height: 1.4; }
      button {
        margin-top: 8px;
        border: none;
        border-radius: 999px;
        background: #2fe0a2;
        color: #05120c;
        font-weight: 800;
        font-size: 14px;
        padding: 10px 22px;
        cursor: pointer;
      }
      button:active { transform: scale(0.96); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="emoji">📡</div>
      <h1>Немає з'єднання з інтернетом</h1>
      <p>Ця сторінка ще не завантажувалась раніше, тому показати її офлайн не вдалося. Раніше відвідані розділи Kharkiv GO — головна, маршрути, зупинки — залишаються доступні офлайн.</p>
      <button onclick="window.location.reload()">Спробувати ще раз</button>
    </div>
  </body>
</html>
